<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Recipe | RecipeShare</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="add"><div id="nav"></div>
<main class="container" id="main"><h1>Add a recipe</h1><form class="panel" id="addForm"><label>Title</label><input id="title" required><label>Category</label><select id="cat"></select>
<label>Cooking time (minutes)</label><input id="time" type="number" min="1" required><label>Difficulty</label><select id="diff"><option>Easy</option><option>Medium</option><option>Hard</option></select>
<label>Short description</label><input id="desc" required><label>Ingredients (one per line)</label><textarea id="ing" rows="4" required></textarea><label>Steps (one per line)</label><textarea id="steps" rows="4" required></textarea>
<p id="msg" style="color:#c0392b"></p><button class="btn">Save recipe</button></form></main>
<div id="foot"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
